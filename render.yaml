services:
  - type: web
    name: betsightly-api
    runtime: docker
    repo: https://github.com/ZILLABB/betsightly-backend.git
    branch: devil
    plan: starter
    healthCheckPath: /api/health/
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: betsightly-db
          property: connectionString
      - key: API_FOOTBALL_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: FOOTBALL_DATA_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: APIFOOTBALL_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://betsightly.vercel.app,https://betsightly.com,http://localhost:3000,http://localhost:5173"

databases:
  - name: betsightly-db
    databaseName: betsightly
    user: betsightly
    plan: free
