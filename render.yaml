services:
  - type: web
    name: betsightly-api
    runtime: docker
    repo: https://github.com/ZILLABB/betsightly-backend.git
    branch: devil
    plan: 1c-2g
    healthCheckPath: /api/health/
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: ENABLE_BACKGROUND_JOBS
        value: "true"
      - key: BETSIGHTLY_PROCESS_ROLE
        value: "all"
      - key: SETTLEMENT_POLL_SECONDS
        value: "900"
      - key: SETTLEMENT_FALLBACK_SECONDS
        value: "3600"
      - key: DAILY_RUN_STALE_MINUTES
        value: "20"
      - key: API_FOOTBALL_DAILY_BUDGET
        value: "90"
      - key: API_FOOTBALL_MINUTE_BUDGET
        value: "8"
      - key: API_FOOTBALL_PROVIDER_RESERVE
        value: "10"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: betsightly-db
          property: connectionString
      - key: API_FOOTBALL_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: FOOTBALL_DATA_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: APIFOOTBALL_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_GROUP_ID
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      # Growth Engine admin dashboard (/admin). Store only the PBKDF2 hash —
      # generate it with growth.admin_auth.hash_password. Unset means the
      # admin API authenticates nobody.
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://betsightly.vercel.app,https://betsightly.com,https://www.betsightly.com,http://localhost:3000,http://localhost:5173"

databases:
  - name: betsightly-db
    databaseName: betsightly
    user: betsightly
    plan: free
