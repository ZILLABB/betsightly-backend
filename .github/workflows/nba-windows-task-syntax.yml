name: NBA Windows scheduler script syntax (private)

on:
  pull_request:
    paths:
      - "scripts/nba_task_reliability.ps1"
      - "scripts/nba_paper_research.ps1"
      - "scripts/nba_score_check.ps1"
      - "scripts/nba_pregame_check.ps1"
      - "basketball/research_injury_reports.py"
      - "basketball/requirements-windows-research.txt"
      - ".github/workflows/nba-windows-task-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-script-syntax:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify IANA Eastern Time on native Windows Python
        shell: powershell
        run: |
          python -m pip install -r basketball/requirements-windows-research.txt
          python -c "from zoneinfo import ZoneInfo; from datetime import datetime; assert datetime(2026,7,1,tzinfo=ZoneInfo('America/New_York')).utcoffset().total_seconds() == -14400; assert datetime(2026,12,1,tzinfo=ZoneInfo('America/New_York')).utcoffset().total_seconds() == -18000; print('ET daylight saving and standard time supported')"
      - name: Parse all scheduled task scripts in Windows PowerShell
        shell: powershell
        run: |
          $paths = @(
              "scripts/nba_task_reliability.ps1",
              "scripts/nba_paper_research.ps1",
              "scripts/nba_score_check.ps1",
              "scripts/nba_pregame_check.ps1"
          )
          foreach ($path in $paths) {
              $tokens = $null
              $issues = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $path).Path, [ref]$tokens, [ref]$issues
              )
              if ($issues.Count -gt 0) {
                  $issues | Format-List
                  throw "Invalid scheduled task PowerShell: $path"
              }
              Write-Host "PowerShell syntax OK: $path"
          }
      - name: Assert opt-in repair has no default task mutations
        shell: powershell
        run: |
          $source = Get-Content "scripts/nba_task_reliability.ps1" -Raw
          if ($source -notmatch 'if \(\$Repair\)' -or
              $source -notmatch 'Export-ScheduledTask' -or
              $source -notmatch 'Set-ScheduledTask') {
              throw "Scheduler diagnostic lacks guarded, backed-up task repair"
          }
          Write-Host "Repair requires explicit switch and exports backups first."
