# Backend CI.
#
# This was passing vacuously for a long time. Three things were wrong at once:
# it ran `pytest tests/unit/ml/ ...` against directories that do not exist, it
# pinned Python 3.9 while the code uses PEP-604 unions (`dict | None`) that
# need 3.10+ and the Dockerfile ships 3.12, and it only triggered on `main` and
# `dev` while the work happens on `devil`.

name: Backend CI

on:
  push:
    branches: [main, dev, devil]
  pull_request:
    branches: [main, dev, devil]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check every module imports
        # The failure 3.9 would have caught if it had got this far, and the
        # one a syntax-only lint misses: a module that parses but explodes on
        # import. Cheap, and it covers far more than the test suite reaches.
        run: |
          python -c "
          import importlib, pathlib, sys
          roots = ['leagues', 'growth']
          failed = []
          for root in roots:
              for path in sorted(pathlib.Path(root).glob('*.py')):
                  if path.stem == '__init__':
                      continue
                  name = f'{root}.{path.stem}'
                  try:
                      importlib.import_module(name)
                  except Exception as exc:
                      failed.append(f'{name}: {type(exc).__name__}: {exc}')
          for line in failed:
              print('FAIL', line)
          print(f'checked {sum(1 for r in roots for _ in pathlib.Path(r).glob(\"*.py\"))} modules')
          sys.exit(1 if failed else 0)
          "

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Check code style
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics


  replay-review:
    # Only the dedicated PR that repairs missing historical market evidence.
    # No production deployment, publication, settlement or current odds mutation.
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/market-replay-readiness-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact production replay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refresh absent/stale market replay from scored history
        shell: bash
        run: |
          if python scripts/check_market_replay.py >/tmp/market-check.log 2>&1; then
            echo "Replay already current; no write needed."
          else
            python scripts/replay_market_evidence.py
            python scripts/check_market_replay.py
          fi
      - name: Commit reproducible evidence for PR review only
        shell: bash
        run: |
          git add data/replay/market_summary.json \
            data/replay/calibration_buckets.json \
            data/replay/league_market_summary.json \
            data/replay/season_market_summary.json \
            data/replay/recency_market_summary.json \
            data/replay/replay_metadata.json
          if git diff --cached --quiet; then
            echo "No refreshed files"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(replay): measured current Over 0.5 and goal market evidence"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
