name: OpenLigaDB exact UEFA fixture audit
on:
  push:
    branches: [fix/uefa-free-settlement-20261028]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe exact fixture and 90-minute source
        run: |
          python - <<'PY'
          import json,re,unicodedata,urllib.request
          fixtures=json.loads("[{\"away\":\"Braga\",\"day\":\"2026-10-15\",\"home\":\"Copenhagen\",\"league\":\"UEFA Conference League\"},{\"away\":\"Getafe\",\"day\":\"2026-10-15\",\"home\":\"CS Universitatea Craiova\",\"league\":\"UEFA Conference League\"},{\"away\":\"FC Thun\",\"day\":\"2026-10-15\",\"home\":\"FC Twente Enschede\",\"league\":\"UEFA Conference League\"},{\"away\":\"Nordsjaelland\",\"day\":\"2026-10-15\",\"home\":\"Heart of Midlothian FC\",\"league\":\"UEFA Conference League\"},{\"away\":\"Ajax\",\"day\":\"2026-10-15\",\"home\":\"HNK Hajduk Split\",\"league\":\"UEFA Conference League\"},{\"away\":\"FC Midtjylland\",\"day\":\"2026-10-15\",\"home\":\"KF Egnatia Rrogozhine\",\"league\":\"UEFA Conference League\"},{\"away\":\"Trabzonspor\",\"day\":\"2026-10-15\",\"home\":\"Kuopion Palloseura\",\"league\":\"UEFA Conference League\"},{\"away\":\"Crvena Zvezda\",\"day\":\"2026-10-15\",\"home\":\"Lugano\",\"league\":\"UEFA Conference League\"},{\"away\":\"Inter Club de Escaldes\",\"day\":\"2026-10-15\",\"home\":\"Mjallby AIF\",\"league\":\"UEFA Conference League\"},{\"away\":\"Monaco\",\"day\":\"2026-10-15\",\"home\":\"PFC CSKA Sofia\",\"league\":\"UEFA Conference League\"},{\"away\":\"FC Iberia 1999\",\"day\":\"2026-10-15\",\"home\":\"St. Truidense VV\",\"league\":\"UEFA Conference League\"},{\"away\":\"Atalanta\",\"day\":\"2026-10-22\",\"home\":\"Ajax\",\"league\":\"UEFA Conference League\"},{\"away\":\"Copenhagen\",\"day\":\"2026-10-22\",\"home\":\"Crvena Zvezda\",\"league\":\"UEFA Conference League\"},{\"away\":\"St. Truidense VV\",\"day\":\"2026-10-22\",\"home\":\"FC Midtjylland\",\"league\":\"UEFA Conference League\"},{\"away\":\"HNK Hajduk Split\",\"day\":\"2026-10-22\",\"home\":\"FC Thun\",\"league\":\"UEFA Conference League\"},{\"away\":\"Freiburg\",\"day\":\"2026-10-22\",\"home\":\"Monaco\",\"league\":\"UEFA Conference League\"},{\"away\":\"Sturm Graz\",\"day\":\"2026-10-15\",\"home\":\"Bournemouth\",\"league\":\"UEFA Europa League\"},{\"away\":\"Juventus\",\"day\":\"2026-10-15\",\"home\":\"Celta\",\"league\":\"UEFA Europa League\"},{\"away\":\"Viktoria Plzen\",\"day\":\"2026-10-15\",\"home\":\"Ferencvarosi Budapest\",\"league\":\"UEFA Europa League\"},{\"away\":\"RSC Anderlecht\",\"day\":\"2026-10-15\",\"home\":\"GNK Dinamo Zagreb\",\"league\":\"UEFA Europa League\"},{\"away\":\"Besiktas Istanbul\",\"day\":\"2026-10-15\",\"home\":\"Hoffenheim\",\"league\":\"UEFA Europa League\"},{\"away\":\"Bayer Leverkusen\",\"day\":\"2026-10-15\",\"home\":\"KKS Lech Poznan\",\"league\":\"UEFA Europa League\"},{\"away\":\"PFC Levski Sofia\",\"day\":\"2026-10-15\",\"home\":\"NEC Nijmegen\",\"league\":\"UEFA Europa League\"},{\"away\":\"AC Omonia Nicosia\",\"day\":\"2026-10-15\",\"home\":\"NK Celje\",\"league\":\"UEFA Europa League\"},{\"away\":\"OFI Crete\",\"day\":\"2026-10-15\",\"home\":\"Rennes\",\"league\":\"UEFA Europa League\"},{\"away\":\"AC Milan\",\"day\":\"2026-10-15\",\"home\":\"Salzburg\",\"league\":\"UEFA Europa League\"},{\"away\":\"Sunderland AFC\",\"day\":\"2026-10-15\",\"home\":\"SCU Torreense\",\"league\":\"UEFA Europa League\"},{\"away\":\"Real Sociedad\",\"day\":\"2026-10-15\",\"home\":\"Union Gilloise\",\"league\":\"UEFA Europa League\"},{\"away\":\"AC Milan\",\"day\":\"2026-10-22\",\"home\":\"Bournemouth\",\"league\":\"UEFA Europa League\"},{\"away\":\"Celta\",\"day\":\"2026-10-22\",\"home\":\"Celtic\",\"league\":\"UEFA Europa League\"},{\"away\":\"NEC Nijmegen\",\"day\":\"2026-10-22\",\"home\":\"GNK Dinamo Zagreb\",\"league\":\"UEFA Europa League\"},{\"away\":\"RSC Anderlecht\",\"day\":\"2026-10-22\",\"home\":\"Jagiellonia Bialystok\",\"league\":\"UEFA Europa League\"},{\"away\":\"Rennes\",\"day\":\"2026-10-22\",\"home\":\"Juventus\",\"league\":\"UEFA Europa League\"},{\"away\":\"Sunderland AFC\",\"day\":\"2026-10-22\",\"home\":\"KKS Lech Poznan\",\"league\":\"UEFA Europa League\"},{\"away\":\"Real Sociedad\",\"day\":\"2026-10-22\",\"home\":\"Lillestroem SK\",\"league\":\"UEFA Europa League\"},{\"away\":\"Marseille\",\"day\":\"2026-10-22\",\"home\":\"Sturm Graz\",\"league\":\"UEFA Europa League\"}]")
          def norm(x):
              x=unicodedata.normalize("NFKD",x.lower())
              x="".join(c for c in x if not unicodedata.combining(c))
              return " ".join(w for w in re.sub(r"[^a-z0-9 ]"," ",x).split() if w not in ("fc","cf"))
          for league,slug in [("UEFA Europa League","uel2026"),("UEFA Conference League","uecl2026")]:
              url="https://api.openligadb.de/getmatchdata/"+slug+"/2026"
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"BetSightly-fixture-audit/1.0"})
              with urllib.request.urlopen(req,timeout=25) as resp: matches=json.load(resp)
              good=[]
              for m in matches:
                  if not m.get("matchIsFinished"):continue
                  res=[r for r in m.get("matchResults",[]) if r.get("resultTypeID")==2]
                  if len(res)!=1 or any(r.get("resultTypeID") in (3,4) for r in m.get("matchResults",[])):continue
                  good.append({"home":m.get("team1",{}).get("teamName",""),"away":m.get("team2",{}).get("teamName",""),"day":m.get("matchDateTimeUTC","")[:10],"score":(res[0]["pointsTeam1"],res[0]["pointsTeam2"])})
              wanted=[f for f in fixtures if f["league"]==league]
              print("LEAGUE",slug,"wanted",len(wanted),"finished_90",len(good))
              for item in wanted:
                  same=[g for g in good if g["day"]==item["day"] and norm(g["home"])==norm(item["home"]) and norm(g["away"])==norm(item["away"])]
                  daymatches=[g for g in good if g["day"]==item["day"]]
                  if len(same)==1: print("EXACT",item["home"],"vs",item["away"],item["day"],same[0]["score"])
                  else:
                      homeclose=[g for g in daymatches if norm(g["home"]) in norm(item["home"]) or norm(item["home"]) in norm(g["home"]) or norm(g["away"]) in norm(item["away"])]
                      print("MISS",item["home"],"vs",item["away"],item["day"],"probable",homeclose[:2])
          PY
