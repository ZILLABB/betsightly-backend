name: 2026 free German third-division probe
on:
  push:
    branches: [fix/german-third-division-finals-20261028]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read exact ODbL 90min German 3.Liga fixtures
        run: |
          python - <<'PY'
          import json,urllib.request
          url='https://api.openligadb.de/getmatchdata/bl3/2026'
          req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'BetSightly-open-score-audit/1.0'})
          with urllib.request.urlopen(req,timeout=20) as response: matches=json.load(response)
          print('TOTAL',len(matches),'FINISHED',sum(x.get('matchIsFinished') is True for x in matches))
          for item in matches:
              if item.get('matchDateTimeUTC','')[:10] not in ['2026-10-13','2026-10-14']:continue
              results=[r for r in item.get('matchResults',[]) if r.get('resultTypeID')==2]
              print('FIXTURE',item.get('matchDateTimeUTC'),item.get('team1',{}).get('teamName'),item.get('team2',{}).get('teamName'),'finished',item.get('matchIsFinished'),'regulation',[(r.get('pointsTeam1'),r.get('pointsTeam2')) for r in results])
          PY
