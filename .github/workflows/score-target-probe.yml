name: Targeted free score filter contract
on:
  push:
    branches:
      - fix/free-score-targeted-lookup-20261028
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test documented football team filter
        run: |
          python - <<'PY'
          import urllib.parse,urllib.request,json
          for team in ('bolivar','instituto-de-cordoba','fc-sloman-liberec','first-vienna-fc-1894','tartu-jk-tammeka'):
              params=urllib.parse.urlencode({'sport':'football','date':'2026-10-27','status':'finished','team':team,'limit':200})
              try:
                  req=urllib.request.Request('https://sportscore.com/api/v1/fixtures/?'+params,headers={'Accept':'application/json','User-Agent':'BetSightly-score-coverage-test/1.0'})
                  with urllib.request.urlopen(req,timeout=12) as response: obj=json.load(response)
                  games=obj.get('matches',[]) if isinstance(obj,dict) else []
                  print('target',team,'count',obj.get('count'), 'games',len(games))
                  print('samples',[(g.get('home'),g.get('away'),g.get('competition'),g.get('time')) for g in games[:3]])
              except Exception as exc:
                  print('target',team,'error',type(exc).__name__,str(exc)[:160])
          PY
