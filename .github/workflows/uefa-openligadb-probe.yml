name: Free UEFA score-feed contract test
on:
  push:
    branches: [fix/uefa-free-settlement-20261028]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test public OpenLigaDB seasonal UEFA finals
        run: |
          python - <<'PY'
          import json,urllib.request
          for shortcut in ("uel2026","uecl2026"):
              url=f"https://api.openligadb.de/getmatchdata/{shortcut}/2026"
              try:
                  req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"BetSightly-free-score-coverage/1.0"})
                  with urllib.request.urlopen(req,timeout=22) as r:
                      raw=json.load(r)
                  print("SHORTCUT",shortcut,"total",len(raw),"finished",sum(x.get("matchIsFinished") is True for x in raw))
                  matches=[x for x in raw if x.get("matchIsFinished") and
                           "2026-10-15" <= (x.get("matchDateTimeUTC") or "")[:10] <= "2026-10-22"]
                  for x in matches[:8]:
                      print("SAMPLE",json.dumps({k:x.get(k) for k in ("matchID","leagueShortcut","leagueSeason","matchDateTimeUTC","team1","team2","matchResults","matchIsFinished")},ensure_ascii=False)[:1500])
              except Exception as exc:
                  print("ERROR",shortcut,type(exc).__name__,str(exc)[:260])
          PY
