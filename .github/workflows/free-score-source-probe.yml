name: Public score source contract probe
on:
  push:
    branches:
      - fix/free-score-source-20261028
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public JSON contract (no credentials, no settlement writes)
        run: |
          python - <<'PY'
          import json, urllib.request
          for day in ('2026-10-27','2026-10-28'):
              url = f'https://sportscore.com/api/v1/fixtures/?sport=football&date={day}&status=finished&limit=200'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'BetSightly-score-coverage-test/1.0','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=14) as resp:
                      data=json.load(resp)
                  print('date',day,'top_level_keys',sorted(data)[:18] if isinstance(data,dict) else 'list')
                  if isinstance(data,dict):
                      print('metadata',str({k:v for k,v in data.items() if isinstance(v,(str,int,float,bool))})[:900])
                      for key,value in data.items():
                          if isinstance(value,list):
                              print('collection',key,'length',len(value))
                              for item in value[:2]:
                                  print('fixture_sample',json.dumps(item,ensure_ascii=False)[:1200])
                  elif isinstance(data,list):
                      print('count',len(data))
                      for item in data[:2]:
                          print('fixture_sample',json.dumps(item,ensure_ascii=False)[:1200])
              except Exception as exc:
                  print('probe_error',day,type(exc).__name__,str(exc)[:260])
          PY
