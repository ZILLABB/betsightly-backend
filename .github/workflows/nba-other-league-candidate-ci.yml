name: NBA additional league candidate contract
"on":
  pull_request:
    paths:
      - "basketball/research_other_league_sources.py"
      - "tests/test_basketball_other_league_candidates.py"
      - "basketball/research_europe_sources.py"
      - "tests/test_basketball_europe_candidates.py"
      - ".github/workflows/nba-other-league-candidate-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-other-league-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest requests
      - run: python -m pytest --noconftest tests/test_basketball_other_league_candidates.py tests/test_basketball_europe_candidates.py -q
      - run: python -m py_compile basketball/research_other_league_sources.py basketball/research_europe_sources.py
