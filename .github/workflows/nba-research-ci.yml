name: NBA Research (offline only)

# This workflow never deploys, publishes or uses provider API credentials.
on:
  pull_request:
    paths:
      - "basketball/**"
      - "tests/test_basketball_research.py"
      - ".github/workflows/nba-research-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only offline research dependencies
        run: python -m pip install pytest scikit-learn==1.8.0 joblib
      - name: Compile research modules
        run: python -m compileall -q basketball/research_data.py basketball/research_features.py basketball/research_model.py basketball/research_tracking.py basketball/research_cli.py
      - name: Run offline NBA regression tests
        run: python -m pytest --noconftest tests/test_basketball_research.py -q
