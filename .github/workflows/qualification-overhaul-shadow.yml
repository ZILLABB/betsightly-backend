name: Football Qualification Shadow (offline)

on:
  pull_request:
    paths:
      - 'leagues/qualification_overhaul_shadow.py'
      - 'scripts/audit_qualification_overhaul.py'
      - 'scripts/export_qualification_snapshot_evidence.py'
      - 'tests/test_qualification_overhaul_shadow.py'
      - '.github/workflows/qualification-overhaul-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Compile shadow code
        run: |
          python -m compileall -q leagues/qualification_overhaul_shadow.py scripts/audit_qualification_overhaul.py scripts/export_qualification_snapshot_evidence.py
      - name: Run shadow adversarial tests
        run: python -m pytest --noconftest -q tests/test_qualification_overhaul_shadow.py
