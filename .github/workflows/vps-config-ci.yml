name: VPS candidate configuration validation

on:
  pull_request:
    branches: [devil]
    paths:
      - 'compose.vps.yml'
      - '.env.vps.example'
      - 'utils/process_roles.py'
      - 'run_background.py'
      - 'tests/test_process_roles.py'
      - 'tests/test_runtime_supervisor.py'
      - 'utils/runtime_supervisor.py'
      - 'utils/worker_freshness.py'
      - 'utils/vps_backup.py'
      - 'tests/test_worker_freshness.py'
      - 'tests/test_vps_backup.py'
      - 'utils/vps_restore.py'
      - 'tests/test_vps_restore.py'
      - 'scripts/vps/**'
      - '.github/workflows/vps-config-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Role ownership regression tests
        run: |
          python -m pip install pytest
          python -m pytest --noconftest tests/test_process_roles.py tests/test_runtime_supervisor.py tests/test_worker_freshness.py tests/test_vps_backup.py tests/test_vps_restore.py -q
      - name: Compile VPS monitoring and backup commands
        run: python -m py_compile scripts/vps/check_worker_freshness.py scripts/vps/backup_postgres.py scripts/vps/restore_drill.py utils/worker_freshness.py utils/vps_backup.py utils/vps_restore.py
      - name: Render Compose without deploying
        run: |
          cp .env.vps.example .env.vps
          docker compose --profile telegram --env-file .env.vps -f compose.vps.yml config --format json > /tmp/betsightly-vps-compose.json
          python -m scripts.vps.validate_compose /tmp/betsightly-vps-compose.json
          rm -f .env.vps
