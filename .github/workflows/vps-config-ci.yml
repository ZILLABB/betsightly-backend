name: VPS candidate configuration validation

on:
  pull_request:
    branches: [devil]
    paths:
      - 'compose.vps.yml'
      - 'compose.coolify.yml'
      - 'scripts/vps/validate_coolify_compose.py'
      - '.env.vps.example'
      - 'utils/process_roles.py'
      - 'run_background.py'
      - 'tests/test_process_roles.py'
      - 'tests/test_runtime_supervisor.py'
      - 'utils/runtime_supervisor.py'
      - 'utils/worker_freshness.py'
      - 'utils/vps_backup.py'
      - 'tests/test_worker_freshness.py'
      - 'tests/test_vps_backup.py'
      - 'utils/vps_restore.py'
      - 'utils/vps_parity.py'
      - 'utils/vps_host_preflight.py'
      - 'utils/vps_startup.py'
      - 'tests/test_vps_startup.py'
      - 'tests/test_vps_host_preflight.py'
      - 'tests/test_vps_parity.py'
      - 'utils/vps_cutover.py'
      - 'utils/vps_offsite.py'
      - 'utils/vps_daily_freshness.py'
      - 'tests/test_vps_daily_freshness.py'
      - 'tests/test_vps_offsite.py'
      - 'deploy/vps/**'
      - 'tests/test_vps_cutover.py'
      - 'tests/test_vps_restore.py'
      - 'scripts/vps/**'
      - '.github/workflows/vps-config-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Role ownership regression tests
        run: |
          python -m pip install pytest
          python -m pytest --noconftest tests/test_process_roles.py tests/test_runtime_supervisor.py tests/test_worker_freshness.py tests/test_vps_backup.py tests/test_vps_restore.py tests/test_vps_cutover.py tests/test_vps_offsite.py tests/test_vps_daily_freshness.py tests/test_vps_parity.py tests/test_vps_host_preflight.py tests/test_vps_startup.py -q
      - name: Compile VPS monitoring and backup commands
        run: python -m py_compile scripts/vps/check_worker_freshness.py scripts/vps/backup_postgres.py scripts/vps/restore_drill.py utils/worker_freshness.py utils/vps_backup.py utils/vps_restore.py utils/vps_cutover.py utils/vps_offsite.py scripts/vps/backup_and_upload.py scripts/vps/check_daily_publication.py utils/vps_daily_freshness.py scripts/vps/check_restore_parity.py utils/vps_parity.py scripts/vps/preflight_host.py utils/vps_host_preflight.py utils/vps_startup.py
      - name: Render Compose without deploying
        run: |
          cp .env.vps.example .env.vps
          docker compose --profile writers --profile telegram --env-file .env.vps -f compose.vps.yml config --format json > /tmp/betsightly-vps-compose.json
          python -m scripts.vps.validate_compose /tmp/betsightly-vps-compose.json
          rm -f .env.vps
      - name: Check Git-backed Coolify Compose has no published host ports
        env:
          DATABASE_URL: postgresql://ci:ci@db.internal.example/betsightly?sslmode=require
          SECRET_KEY: synthetic-ci-only
          API_KEY: synthetic-ci-only
          ALLOWED_ORIGINS: https://stage.betsightly.invalid
          ALLOWED_HOSTS: stage.betsightly.invalid
          BETSIGHTLY_VPS_WRITER_ACTIVATION: disabled
        run: |
          docker compose --profile writers --profile telegram -f compose.coolify.yml config --format json > /tmp/betsightly-coolify.json
          python -m scripts.vps.validate_coolify_compose /tmp/betsightly-coolify.json
