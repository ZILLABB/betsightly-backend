name: One-off Oct 20 no-overlap missing 5x 10x and 10 over selections
on:
  pull_request:
    branches: [devil]
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'ops/oct20-unpublished-tier-exact-scout'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'fastapi==0.104.1' 'pydantic==2.5.0' 'pydantic-settings==2.1.0' 'SQLAlchemy==2.0.23' 'python-dotenv==1.0.0'
      - name: Verify distinct Oct 20 tickets with SportyBet code readback
        env:
          DATABASE_URL: sqlite:///./oct20_no_overlap_verified.db
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone,timedelta
          from math import prod
          from leagues import sportybet
          from leagues.curated_booking import CuratedBookingRequest,generate_curated_booking
          tickets={
             "FIVE_ODDS":[
               ("Sabah Masazir","Borussia Dortmund","away_win"),
               ("Roma","Slovan Bratislava","home_win"),
               ("Man City","AEK Athens","home_win"),
               ("Al Nassr Club","Neom SC","home_win"),
               ("Al-Taawoun FC","Al Qadsiah","away_win"),
               ("Fenerbahce Istanbul","Slavia Prague","home_win"),
             ],
             "TEN_ODDS":[
               ("Porto","PSV Eindhoven","over_1_5"),
               ("Napoli","Bodoe/Glimt","over_1_5"),
               ("Stuttgart","Atletico Madrid","over_1_5"),
               ("PSG","Barcelona","over_2_5"),
               ("Wolves","Portsmouth FC","home_win"),
               ("Bromley FC","Leicester","away_or_draw"),
               ("Barnet FC","Swindon Town","home_win"),
               ("Doncaster Rovers","Stockport County FC","away_or_draw"),
               ("IFK Norrkoping FK","Orebro SK","over_2_5"),
               ("Huddersfield","Peterborough United","over_1_5"),
             ],
             "MIXED_OVER_GOALS":[
               ("Blackpool FC","Milton Keynes Dons","over_1_5"),
               ("AFC Wimbledon","Mansfield Town","over_1_5"),
               ("Cambridge United","Wycombe Wanderers","over_1_5"),
               ("Chesterfield FC","Colchester United","over_1_5"),
               ("York City FC","Accrington Stanley","over_1_5"),
               ("Yeovil Town","Leatherhead FC","over_1_5"),
               ("Forest Green Rovers","Chesham United","over_1_5"),
               ("Al-Ettifaq FC","Al-Ittihad Club","over_1_5"),
               ("Dewa United","Persijap Jepara","over_2_5"),
               ("Luton","Barnsley FC","over_1_5"),
             ],
          }
          protected={
              ("Gillingham FC","Port Vale"),
              ("Exeter City","Crewe Alexandra"),
              ("Londrina EC PR","Cuiaba EC MT"),
              ("Liverpool","Villarreal"),
              ("Deportivo Pereira FC SA","Boyaca Chico FC"),
          }
          all_matches=[(h.casefold(),a.casefold()) for legs in tickets.values() for h,a,_ in legs]
          assert len(all_matches)==26 and len(all_matches)==len(set(all_matches))
          assert not set(all_matches) & {(h.casefold(),a.casefold()) for h,a in protected}
          assert len(tickets["MIXED_OVER_GOALS"])==10
          assert all(m.startswith("over_") for _,_,m in tickets["MIXED_OVER_GOALS"])
          for trial in range(1,4):
              board=sportybet.fetch_board(force=True)
              meta=sportybet.board_metadata(board)
              print("OCT20_BOARD_ATTEMPT_"+str(trial)+"="+json.dumps(meta,ensure_ascii=False))
              if meta.get("is_complete") is True:break
          if meta.get("is_complete") is not True:
              print("STOP_WITHHOLD_ALL_CODES_INCOMPLETE_BOARD");raise SystemExit(0)
          tz=timezone(timedelta(hours=1))
          available=[]
          for _,entry in sportybet._board_entries(board):
              try:k=datetime.fromtimestamp(int(entry["kickoff_ms"])/1000,timezone.utc).astimezone(tz)
              except:continue
              if k.date().isoformat()!="2026-10-20" or k.hour<9:continue
              textval=" ".join(str(entry.get(x) or "") for x in ("home_team","away_team","competition")).lower()
              if any(s in textval for s in (" srl","virtual","simulated","u17","u19","u20","u21","u23","women","ladies","youth","cyber")):continue
              available.append((entry,k))
          sportybet.fetch_board=lambda force=False,**kwargs:board
          for tier,choices in tickets.items():
              legs=[]
              for home,away,market in choices:
                  found=[(entry,k) for entry,k in available if
                        str(entry.get("home_team") or "").casefold()==home.casefold() and
                        str(entry.get("away_team") or "").casefold()==away.casefold()]
                  if len(found)!=1:
                      print(tier+"_WITHHELD_MISSING_OR_AMBIGUOUS_FIXTURE="+json.dumps(dict(home=home,away=away,count=len(found))));break
                  e,k=found[0]
                  if market not in (e.get("prices") or {}):
                      print(tier+"_WITHHELD_MARKET="+str((home,away,market)));break
                  legs.append(dict(home_team=e["home_team"],away_team=e["away_team"],
                    league=e["competition"],kickoff=k.isoformat(),market=market))
              if len(legs)!=len(choices):
                  print(tier+"_WITHHELD_INCOMPLETE_LEGS="+str(len(legs)));continue
              try:
                  r=generate_curated_booking(CuratedBookingRequest(legs=legs))
                  if r.get("status")!="success":
                      print(tier+"_WITHHELD_REJECTED="+json.dumps({k:r.get(k) for k in ("reason","failures","requested_legs")},ensure_ascii=False));continue
                  if r.get("readback_validation")!="PASSED" or r.get("legs")!=len(legs) or len(r.get("selections") or [])!=len(legs):
                      print(tier+"_WITHHELD_FAILED_READBACK");continue
                  prices=[x.get("sportybet_odds") for x in r["selections"]]
                  odds=r.get("actual_sportybet_odds")
                  if odds is None:
                      odds=prod(map(float,prices)) if len(prices)==len(legs) and all(prices) else None
                  if odds is None or float(odds)<{"FIVE_ODDS":5.0,"TEN_ODDS":10.0,"MIXED_OVER_GOALS":1.0}[tier]:
                      print(tier+"_WITHHELD_WRONG_TIER="+str(odds));continue
                  print(tier+"_VERIFIED_CODE="+str(r.get("share_code")))
                  print(tier+"_VERIFIED_ODDS="+str(round(float(odds),4)))
                  print(tier+"_VERIFIED_MARKETS="+json.dumps([x["market"] for x in r["selections"]]))
                  print(tier+"_VERIFIED_SELECTIONS="+json.dumps(r["selections"],ensure_ascii=False))
                  print(tier+"_VERIFIED_READBACK="+str(r.get("readback_validation")))
                  print(tier+"_BOARD_SNAPSHOT="+str(r.get("board_snapshot_id")))
              except Exception as exc:
                  print(tier+"_WITHHELD_ERROR="+type(exc).__name__+" "+str(exc)[:250])
          PY
