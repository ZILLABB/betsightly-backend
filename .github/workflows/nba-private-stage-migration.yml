name: NBA staging - isolated Supabase migration
# Exact GitHub-signed source workflow identity is checked by the stage service.
# Read-only automatic probe rerun 2026-10-27 after private-schema pin deployment.
# No source archive or PostgreSQL password enters GitHub.
"on":
  # Deliberately prohibit push-triggered DB actions; staging verifier only
  # allows a GitHub-signed explicit workflow_dispatch from the exact workflow.
  workflow_dispatch:
    inputs:
      mode:
        description: "Probe (read only), compare current source to target (read only), or one-time restore"
        type: choice
        required: true
        options:
          - probe
          - compare
          - restore
permissions:
  contents: read
concurrency:
  group: nba-private-staging-database-migration
  cancel-in-progress: false
jobs:
  verify-target:
    if: github.repository == 'ZILLABB/betsightly-backend' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify runner has no credential requirement
        run: python -m unittest discover -s tests -p test_nba_private_migration_ping.py -v
      - name: Run signed, scope-restricted, server-side migration action
        run: python -m scripts.nba_stage_migration_ping "${{ inputs.mode || 'probe' }}"
