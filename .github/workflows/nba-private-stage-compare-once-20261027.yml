name: NBA staging - read-only source and Supabase parity verification
# One-time authorized compare; no credentials, no archive or SQL in GitHub.
"on":
  push:
    branches: [dev]
    paths:
      - ".github/workflows/nba-private-stage-compare-once-20261027.yml"
permissions:
  contents: read
jobs:
  verify-source-target-evidence:
    if: github.repository == 'ZILLABB/betsightly-backend' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch signed read-only live-source versus Supabase comparison
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'nba-private-stage-migration.yml', ref: 'dev',
              inputs: { mode: 'compare' },
            });
            core.notice('Dispatched read-only comparison. Only the child run establishes parity.');
