name: NBA closeout V2 health and guarded release CI
"on":
  pull_request:
    paths:
      - "basketball/research_ops_health.py"
      - "basketball/research_closeout.py"
      - "growth/api.py"
      - "tests/test_nba_closeout_health_v2.py"
      - ".github/workflows/nba-closeout-v2-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-closeout-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Compile private backend checks
        run: python -m py_compile basketball/research_ops_health.py basketball/research_closeout.py growth/api.py
      - name: Offline full-backup, readiness and route regression
        run: python -m pytest --noconftest tests/test_nba_closeout_health_v2.py tests/test_basketball_ops_health.py tests/test_basketball_full_recovery.py tests/test_nba_five_stream_gates.py -q
