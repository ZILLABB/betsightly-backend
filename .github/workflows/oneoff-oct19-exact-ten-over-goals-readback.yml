name: One-off verified ten distinct over-goals Oct 19
on:
  pull_request:
    branches: [devil]
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'ops/oct19-exact-ten-goals-no-tiers-overlap'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install --disable-pip-version-check 'fastapi==0.104.1' 'pydantic==2.5.0' 'pydantic-settings==2.1.0' 'SQLAlchemy==2.0.23' 'python-dotenv==1.0.0'
    - name: Verify exactly 10 different over-goals fixtures with full SportyBet readback
      env:
        DATABASE_URL: sqlite:///./oct19_ten_over_readback.db
      run: |
        python - <<'PY'
        import json
        from math import prod
        from datetime import datetime,timezone,timedelta
        from leagues import sportybet
        from leagues.curated_booking import CuratedBookingRequest,generate_curated_booking
        wanted=[
          ("Lee Man FC","Kitchee","over_2_5"),
          ("FC RFS","FK Tukums 2000/TSS","over_1_5"),
          ("Jong Ajax Amsterdam","De Graafschap","over_1_5"),
          ("Jong PSV Eindhoven","FC Dordrecht","over_1_5"),
          ("Jong FC Utrecht","Roda JC Kerkrade","over_1_5"),
          ("Fram Reykjavik","IA Akranes","over_2_5"),
          ("Varbergs BoIS","Helsingborgs IF","over_1_5"),
          ("SC FC Voluntari","Fotbal Club FCSB","over_1_5"),
          ("1. FC Tatran Presov","MSK Zilina B","over_1_5"),
          ("Al Jahra","Kazma SC","over_1_5")
        ]
        assert len(wanted)==10 and len({x[0].lower() for x in wanted})==10
        occupied={
         "Kuwait SC","FC Universitatea Cluj","Beitar Jerusalem FC","Viborg FF",
         "Tottenham","Bursaspor","Trabzonspor","Braga","Al-Shabab FC (SA)",
         "Pafos FC","Derry City FC","Monza","Parma Calcio","Fatih Karagumruk Istanbul",
         "Waterford FC","Rodina Moscow","Getafe","Al Hilal SFC",
         "Al-Fayha FC","AC Omonia Nicosia","Wisla Plock"
        }
        assert not {x[0].lower() for x in wanted} & {x.lower() for x in occupied}, "overlap with other tickets"
        for attempt in range(1,4):
          board=sportybet.fetch_board(force=True)
          meta=sportybet.board_metadata(board)
          print("TEN_GOALS_BOARD_ATTEMPT_"+str(attempt)+"="+json.dumps(meta,ensure_ascii=False))
          if meta.get("is_complete") is True:break
        if meta.get("is_complete") is not True:
          print("TEN_GOALS_WITHHELD_INCOMPLETE_BOARD");raise SystemExit(0)
        tz=timezone(timedelta(hours=1))
        rows=[]
        for _,e in sportybet._board_entries(board):
          ts=e.get("kickoff_ms")
          if not ts:continue
          try:k=datetime.fromtimestamp(int(ts)/1000,timezone.utc).astimezone(tz)
          except:continue
          if str(k.date())!="2026-10-19":continue
          words=(" ".join(str(e.get(x) or "") for x in ("home_team","away_team","competition"))).lower()
          if any(s in words for s in ("srl","u19","u20","u21","u23","ladies","women","virtual","simulated","youth")):continue
          rows.append((e,k))
        legs=[]
        for home,away,market in wanted:
          matched=[(e,k) for e,k in rows if home.lower()==str(e.get("home_team") or "").lower() and away.lower()==str(e.get("away_team") or "").lower()]
          if len(matched)!=1:
            print("TEN_GOALS_MISSING="+json.dumps(dict(home=home,away=away,market=market,count=len(matched)),ensure_ascii=False))
            raise SystemExit(0)
          e,k=matched[0]
          if market not in (e.get("prices") or {}):
            print("TEN_GOALS_MISSING_PRICE="+home+" "+market);raise SystemExit(0)
          legs.append(dict(home_team=e["home_team"],away_team=e["away_team"],league=e["competition"],kickoff=k.isoformat(),market=market))
        if len(legs)!=10 or len({(a["home_team"],a["away_team"]) for a in legs})!=10:
          print("TEN_GOALS_WITHHELD_WRONG_COUNT");raise SystemExit(0)
        sportybet.fetch_board=lambda force=False,**kwargs:board
        try:
          res=generate_curated_booking(CuratedBookingRequest(legs=legs))
          if res.get("status")!="success":
            print("TEN_GOALS_BOOKING_REJECTED="+json.dumps({k:res.get(k) for k in ("status","reason","failures","requested_legs")},ensure_ascii=False))
            raise SystemExit(0)
          if res.get("legs")!=10 or res.get("readback_validation")!="PASSED" or len(res.get("selections") or [])!=10:
            print("TEN_GOALS_WITHHELD_READBACK_OR_LEG_COUNT="+json.dumps({k:res.get(k) for k in ("legs","readback_validation")}))
            raise SystemExit(0)
          prices=[a.get("sportybet_odds") for a in res["selections"]]
          odds=res.get("actual_sportybet_odds")
          if odds is None and len(prices)==10 and all(prices):odds=prod(map(float,prices))
          if not odds or not res.get("share_code"):
            print("TEN_GOALS_WITHHELD_NO_REAL_CODE_PRICE");raise SystemExit(0)
          print("TEN_GOALS_EXACT_CODE="+str(res["share_code"]))
          print("TEN_GOALS_EXACT_ODDS="+str(odds))
          print("TEN_GOALS_EXACT_READBACK="+str(res["readback_validation"]))
          print("TEN_GOALS_EXACT_LEGS="+json.dumps(res["selections"],ensure_ascii=False))
          print("TEN_GOALS_BOARD_ID="+str(res.get("board_snapshot_id")))
        except Exception as ex:
          print("TEN_GOALS_ERROR="+type(ex).__name__+": "+str(ex)[:280])
        PY
