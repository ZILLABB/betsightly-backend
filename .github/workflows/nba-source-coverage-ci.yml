name: NBA prospective source coverage and calibration acceptance
"on":
  pull_request:
    paths:
      - "basketball/research_schedule_coverage.py"
      - "basketball/research_hosted_forecast.py"
      - "basketball/research_forward_scorecard.py"
      - "basketball/research_ops_health.py"
      - "basketball/research_full_recovery.py"
      - "basketball/research_closeout.py"
      - "growth/api.py"
      - "tests/test_nba_source_coverage_acceptance.py"
      - ".github/workflows/nba-source-coverage-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-coverage-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Compile source and private API
        run: python -m py_compile basketball/research_schedule_coverage.py basketball/research_hosted_forecast.py basketball/research_forward_scorecard.py basketball/research_ops_health.py basketball/research_full_recovery.py growth/api.py
      - name: Frozen model and source coverage regression suite
        run: python -m pytest --noconftest tests/test_nba_source_coverage_acceptance.py tests/test_basketball_hosted_forecast.py tests/test_nba_five_stream_gates.py tests/test_basketball_full_recovery.py tests/test_basketball_ops_health.py tests/test_nba_closeout_health_v2.py -q
